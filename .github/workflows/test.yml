name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python lock_dependencies.py --check
      - run: python -m pytest -q
      - run: node --test tests/dashboard.test.cjs
  dependency-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python audit_dependencies.py --output output/advisories/report.json
      - name: Preserve dated dependency advisory evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-advisories
          path: output/advisories/report.json
          if-no-files-found: error
          retention-days: 14
  source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python build_deployment.py --output-dir output/ci-bundle
      - name: Extract the verified ZIP into separate source storage
        run: python -m zipfile -e output/ci-bundle/AgentX_Learn_Deployment.zip output/bundle-smoke
      - name: Install and recover using only the bundled source
        working-directory: output/bundle-smoke
        run: python container_smoke.py
      - name: Preserve verified source bundle and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-source-bundle
          path: |
            output/ci-bundle/AgentX_Learn_Deployment.zip
            output/ci-bundle/AgentX_Learn_Deployment.sha256
          if-no-files-found: error
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python container_smoke.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser_tests -q
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 7
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python benchmark_demo.py --learners 1 5 10 --read-rounds 5 --output output/benchmark/report.json
      - name: Preserve aggregate capacity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-capacity-benchmark
          path: output/benchmark/report.json
          if-no-files-found: error
          retention-days: 14
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out reviewed 0.2.0 baseline separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8c5a357043fbfa5e562b49afc693894e5f3d435b
          path: output/upgrade-previous
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python upgrade_smoke.py output/upgrade-previous
      - name: Preserve successful fictional-data rehearsal record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-upgrade-rehearsal
          path: output/upgrade/rehearsal.json
          if-no-files-found: error
          retention-days: 14
