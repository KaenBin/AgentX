[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentx"
version = "0.1.0"
description = "A practical, production-minded framework for building agentic AI solutions for Singapore SMEs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentX" }]
keywords = ["agentic-ai", "llm", "orchestration", "sme", "singapore", "workflows"]

# Core dependencies are intentionally light. The framework ships with
# provider-agnostic interfaces; concrete LLM SDKs are optional extras so
# SMEs can pick a provider (or a local model) without carrying the rest.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
agentx = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/workflows", "src/agents", "src/tools", "src/utils"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests that exercise multiple components together",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
