name: agentx-demo
services:
  app:
    build: .
    image: agentx-learn:demo-foundation
    ports:
      - "127.0.0.1:${DEMO_PORT:-8010}:8000"
    environment:
      AGENT_MODE: demo
      TRAINING_DB: /app/data/training.db
    volumes:
      - training-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  training-data:
